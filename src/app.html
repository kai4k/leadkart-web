<!doctype html>
<html lang="%lk.html.lang%" %lk.html.attrs%>
	<head>
		<meta charset="utf-8" />
		<!-- LeadKart icons (the approved logo pack): the vector icon and the .ico for tabs and bookmarks,
		     the PNG sizes for browsers that want a raster, the touch icon for iOS home screens. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<!-- Mobile browser chrome and Windows tiles: the Iris primary, written by `npm run brand:icons` from the tokens (never hand-typed; `--check` guards it). -->
		<meta name="theme-color" content="#6252E0" />
		<meta name="msapplication-TileColor" content="#6252E0" />
		<meta name="msapplication-TileImage" content="%sveltekit.assets%/mstile-150x150.png" />
		<meta name="msapplication-square310x310logo" content="%sveltekit.assets%/mstile-310x310.png" />
		<!-- PWA manifest — installable as standalone app via Add to Home
		     Screen on iOS/Android + Install via Chromium prompt on
		     desktop. Service worker registered in src/service-worker.ts. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="application-name" content="LeadKart" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="LeadKart" />
		<!-- Link previews: written here, not by a layout, because the (auth) routes are client-rendered and a crawler
		     that fetches /signin gets only this shell. PUBLIC_SITE_URL (public origin, no trailing slash) makes the URLs
		     absolute, which a preview crawler requires; unset (development) they are root-relative. -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="LeadKart" />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image-light.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image-light.png" />
		<title>LeadKart</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
