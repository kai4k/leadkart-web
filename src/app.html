<!doctype html>
<html lang="en" %lk.html.attrs%>
	<head>
		<meta charset="utf-8" />
		<!-- LeadKart favicon set — multi-size PNG matching the Blazor canon.
		     Browsers pick the closest size for tab / pinned tab / homescreen. -->
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/images/favicon/favicon_16x16.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/images/favicon/favicon_32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="64x64"
			href="%sveltekit.assets%/images/favicon/favicon_64x64.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="128x128"
			href="%sveltekit.assets%/images/favicon/favicon_128x128.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="256x256"
			href="%sveltekit.assets%/images/favicon/favicon_256x256.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="512x512"
			href="%sveltekit.assets%/images/favicon/favicon_512x512.png"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Mobile browser chrome — LeadKart logo purple-violet (#502d81
		     wordmark base). Static. -->
		<meta name="theme-color" content="#502d81" />
		<!-- PWA manifest — installable as standalone app via Add to Home
		     Screen on iOS/Android + Install via Chromium prompt on
		     desktop. Service worker registered in src/service-worker.ts. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="application-name" content="LeadKart" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="LeadKart" />
		<title>LeadKart</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
