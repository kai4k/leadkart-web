name: _a11y
# Reusable workflow — strict WCAG 2.2 AA enforcement via axe-core on
# every signed-in + unauthenticated route. Called by ci.yml after the
# build job uploads the build/ artifact.
#
# Strictness contract (tests/a11y/routes.spec.ts):
#   - fails on impact: critical
#   - fails on impact: serious
#   - fails on impact: moderate  ← tightened from the previous suite
#   - flags impact: minor as warnings (don't gate CI)
#
# Chromium-only — axe is rendering-engine-independent. Cross-browser
# wouldn't add a11y signal, just runtime.

on:
  workflow_call:
    inputs:
      playwright-image:
        description: Official Playwright image for the locked version (browsers + system packages).
        required: true
        type: string

jobs:
  a11y:
    name: A11y (WCAG 2.2 AA)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: ${{ inputs.playwright-image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: build/

      - name: Run a11y suite
        run: npx playwright test --project=a11y
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-playwright-report
          path: playwright-report/
          retention-days: 14
