name: _visual
# Reusable workflow — Playwright visual regression. Called by ci.yml
# after the build job uploads the build/ artifact.
#
# Behaviour
# ─────────
# - Single chromium runner (cross-browser visual diffs are noise; the
#   canonical industry pattern is to pin one engine — Playwright docs +
#   Vercel Argos-CI + Chromatic all do this).
# - Runs in the official Playwright image for the locked version, so the
#   browser and its system packages come with the image; downloads the
#   build/ artifact.
# - Uploads HTML report + traces on failure for human review.
#
# Baseline policy
# ───────────────
# Snapshot baselines live in `tests/visual/**/*.spec.ts-snapshots/` as
# `*-visual-linux.png` and are committed to git. If the diff fails, the
# failure HTML report makes the pixel delta obvious and the engineer either:
#   1. Fixes the regression, OR
#   2. Regenerates the baselines as a deliberate visual change: push a
#      commit whose message contains `[regen-visuals]`, or run the
#      visual-refresh workflow by hand. Baselines made on Windows or macOS
#      are `-win32` / `-darwin` files that CI never compares against.
#
# This is the standard canon for visual-regression-in-CI (Vercel,
# Stripe, Linear all ship this pattern).

on:
  workflow_call:
    inputs:
      playwright-image:
        description: Official Playwright image for the locked version (browsers + system packages).
        required: true
        type: string

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ inputs.playwright-image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: build/

      - name: Run visual regression suite
        run: npx playwright test --project=visual
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload visual diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14
