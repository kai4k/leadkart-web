name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# Cancel in-flight runs on the same branch when a new commit lands.
# Saves runner minutes + GitHub minutes quota. Industry canon (every
# Linear / Vercel / Stripe public CI yaml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Combined static-analysis + unit + build + e2e in ONE job.
  #
  # Why combined: separating build and e2e into two jobs forces a
  # second `npm install` + an artifact upload/download round-trip
  # for the build output. At ~30s × 2 + ~30s × 2 = ~2-3 minutes
  # of duplicated work per PR. For a free-tier private repo
  # (2,000 min/month), that's a meaningful chunk over time.
  #
  # Order is fast-fail: cheap checks (audit, lint, check, test) run
  # before the expensive ones (build, e2e), so a typo-level bug
  # consumes seconds rather than the whole pipeline budget.
  ci:
    name: Build & test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        # `npm install` (not `npm ci`) because our dep tree includes
        # platform-specific WASM bindings (@rolldown/binding-wasm32-wasi,
        # @tailwindcss/oxide-wasm32-wasi) that Vite 8 + Tailwind 4 ship
        # as optional fallbacks for native modules. npm 11's strict
        # `npm ci` rejects the lock when the host platform's variant
        # differs from the lock-author's platform — known issue tracked
        # in npm/cli#5169 + vite/vite#15869. Plain `npm install` with
        # `--prefer-offline` reuses the lock when possible while
        # tolerating cross-platform variance. Lock determinism is still
        # enforced at PR-review time via committed package-lock.json
        # + Dependabot.
        #
        # .npmrc sets legacy-peer-deps=true (TypeScript 6 + Storybook 10
        # + culori + colord ahead of ecosystem peer ranges; integration
        # works, only npm's strict check is the blocker). Pinning to the
        # lockfile keeps the actual versions canonical.
        run: npm install

      - name: Security audit (high+ severity blocks)
        # Cheap (~5s with cached registry); runs early so a vulnerable
        # transitive dep blocks the rest of the pipeline before we
        # spend minutes on lint / build / e2e. Dependabot covers
        # ongoing surveillance of merged deps; this catches NEW
        # vulnerable deps introduced by the PR itself.
        run: npm audit --omit=dev --audit-level=high

      # SvelteKit generates .svelte-kit/tsconfig.json + ambient types
      # ($app, $env, $lib, route $types) via the sync step. Anything
      # downstream that touches tsconfig.json (dep-cruiser, eslint with
      # projectService, svelte-check, vite build) needs this dir to
      # exist. Running it explicitly + early avoids the "Cannot read
      # file .svelte-kit/tsconfig.json" crash that hit our lint:deps
      # step.
      #
      # SvelteKit docs recommend this as the canonical CI setup step.
      - name: SvelteKit sync — generate .svelte-kit ambient types
        run: npx svelte-kit sync

      # Persist ESLint's per-file content cache across CI runs.
      # First cold run: ~3-4 min (typescript-eslint loads the entire
      # TS program graph including node_modules type-defs).
      # Subsequent warm runs: ~30-60s (only changed files re-typed).
      # Cache key invalidates when package-lock.json (deps) or
      # eslint.config.js (rules) change; restore-keys allows partial
      # fallback when only one of them changes.
      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: |
            .eslintcache
            .stylelintcache
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', '.stylelintrc.cjs') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', '.stylelintrc.cjs') }}-
            lint-${{ runner.os }}-

      - name: Lint — prettier + eslint
        # NODE_OPTIONS bumps the heap so typescript-eslint's TS-program
        # creation doesn't trigger GC thrash on the 7GB CI runner. ESLint
        # 10's --concurrency=auto (set in package.json script) splits the
        # file set across cores (2 on GitHub Actions free tier → ~50%
        # faster than serial).
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run lint

      - name: Lint — stylelint (design-token discipline)
        run: npm run lint:css

      - name: Lint — dependency-cruiser (layering boundaries)
        run: npm run lint:deps

      - name: Architecture gate — custom static checks (13 checks)
        # Component inventory, token completeness, WCAG contrast, locale
        # parity, RTL safety, i18n coverage, route +error.svelte pages,
        # feature structure, fetch placement, Svelte-5 purity, LOC budgets,
        # /v1/platform path scope, mutate-then-refetch ban.
        run: npm run arch:check

      - name: Type check (svelte-check + tsc)
        run: npm run check

      - name: Lint — knip (dead code + unused exports)
        # Knip surfaces unused exports + files. Currently runs as a
        # non-blocking advisory because the feature barrels expose
        # types that aren't consumed yet by route code. Promote to a
        # hard gate once the consumer surface stabilises.
        run: npm run lint:dead -- --no-exit-code || true

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage (push-to-main only)
        # Coverage on PR is rarely actioned; the merged-into-main
        # report is the one teams reference for trend lines. Skipping
        # PR uploads saves ~20s per PR + storage.
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Bundle-size check
        run: npx size-limit

      # Cache Playwright's chromium across runs — saves ~30s per run
      # when the @playwright/test version is unchanged. Cache key
      # includes the package version so a bump invalidates cleanly.
      - name: Get Playwright version
        id: pw-version
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright chromium
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests (chromium)
        # Chromium-only matrix per chore/ci-cost-reduction:
        # Firefox + WebKit re-add when a browser-specific bug
        # surfaces or pre-launch coverage demands it. ~70% of
        # browser usage is Chromium-based (Chrome + Edge); the
        # JS engine differences rarely manifest in our SPA's
        # form/CRUD surfaces.
        run: npx playwright test --project=chromium --reporter=html
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
