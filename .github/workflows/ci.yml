name: CI
on:
  # GitHub Actions doesn't expand YAML anchors (& / *), so the paths-ignore
  # list is duplicated here. Keep both copies in sync when editing.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# Cancel in-flight runs on the same branch when a new commit lands.
# Saves runner minutes when developers push rapid follow-ups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── PARALLEL-MATRIX CI ─────────────────────────────────────────────
#
#   install (1-2 min cold, 30s warm)        ← populates node_modules cache
#     ↓
#   ┌─────────────────────────────────────────────────────────────┐
#   │  lint        typecheck      test         build              │
#   │  ~3min cold  ~30s           ~10s         ~30s               │
#   │  ~30s warm                                                  │
#   └─────────────────────────────────────────────────────────────┘
#                                              ↓ uploads build/ artifact
#                                       ┌──────────────────────────────┐
#                                       │  e2e × 4 shards (parallel)   │
#                                       │  ~1.2-1.5 min wall-clock     │
#                                       └──────────────────────────────┘
#                                              ↓
#                                       [ci-pass sentinel]
#
# Wall-clock target: ~3-5 min warm cache, ~6-8 min cold.
#
# Each tier's body lives in its own reusable workflow under
# .github/workflows/_*.yml — this orchestrator just wires the
# dependency graph. FAANG-canon DRY (Vercel, SvelteKit, Stripe).

jobs:
  # ─── Install deps once; downstream jobs restore from cache ───
  install:
    name: Install deps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Security audit (high+ severity blocks)
        # Runs in the install job (not a separate one) because audit
        # is a 5-second check on a freshly resolved dep tree — pulling
        # it into its own parallel job would add 15s of setup overhead
        # to save 5s of run time.
        run: npm audit --omit=dev --audit-level=high

  # ─── Static analysis lanes (parallel; all start after install) ───
  lint:
    name: Lint
    needs: install
    uses: ./.github/workflows/_lint.yml

  typecheck:
    name: Typecheck
    needs: install
    uses: ./.github/workflows/_typecheck.yml

  test:
    name: Test
    needs: install
    uses: ./.github/workflows/_test.yml

  build:
    name: Build
    needs: install
    uses: ./.github/workflows/_build.yml

  # ─── E2E sharded across 4 runners (depends on build artifact) ───
  e2e:
    name: E2E
    needs: build
    uses: ./.github/workflows/_e2e.yml

  # ─── Sentinel: single check for branch protection ───
  # Branch protection targets THIS job rather than each matrix shard
  # individually. Adding/removing e2e shards doesn't require updating
  # branch protection rules.
  ci-pass:
    name: CI pass
    if: always()
    needs: [install, lint, typecheck, test, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify all required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed."
