name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# Cancel in-flight runs on the same branch when a new commit lands.
# Saves runner minutes + GitHub minutes quota. Industry canon (Linear /
# Vercel / Stripe public CI yaml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── PARALLEL-MATRIX CI ───────────────────────────────────────────
#
# Single setup → fan-out to lint / typecheck / test / build → e2e
# shards (depend on build) → final gate. Wall-clock dominated by the
# slowest job in each tier (max), not the sum (sequential).
#
#   setup (install + svelte-kit sync)        ~1-2 min
#     ↓
#   ┌────────────────────────────────────────┐
#   │  lint   typecheck   test   build       │  parallel — runs once setup
#   │  ~3min  ~30s        ~10s   ~30s        │  completes; each restores
#   └────────────────────────────────────────┘  cached node_modules.
#                              ↓
#                          ┌───────────┐
#                          │ e2e shards│  ~2-3 min wall-clock per shard;
#                          │  1/2  2/2 │  18 spec files split 9/9.
#                          └───────────┘
#                              ↓
#                          [ci-pass gate]
#
# Total wall-clock: ~6-8 min (was ~15 min serial).
# Total job-minutes consumed: ~18-22 (~20% more than serial — the
# cost of 3× speedup).
#
# Industry refs:
#   - Vercel's Next.js CI (public github.com/vercel/next.js)
#   - SvelteKit's own CI (github.com/sveltejs/kit/.github/workflows/ci.yml)
#   - Stripe Engineering blog "CI architecture at Stripe" 2024
# ────────────────────────────────────────────────────────────────────

jobs:
  # ─── Setup: install deps once, cache for downstream jobs ────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      deps-cache-key: ${{ steps.deps-key.outputs.key }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Compute deps cache key
        id: deps-key
        run: echo "key=deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        # `npm install` (not `npm ci`) because the dep tree includes
        # platform-specific WASM bindings (@rolldown/binding-wasm32-wasi,
        # @tailwindcss/oxide-wasm32-wasi) that Vite 8 + Tailwind 4 ship
        # as optional fallbacks for native modules. `.npmrc` sets
        # legacy-peer-deps + prefer-offline so this stays fast + tolerant.
        run: npm install

      - name: Security audit (high+ severity blocks)
        run: npm audit --omit=dev --audit-level=high

      - name: SvelteKit sync — generate .svelte-kit ambient types
        # Generates .svelte-kit/tsconfig.json + ambient types ($app,
        # $env, $lib, route $types). Required by anything downstream
        # that reads tsconfig.json (dep-cruiser, eslint projectService,
        # svelte-check, vite build).
        run: npx svelte-kit sync

      - name: Cache node_modules + .svelte-kit
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            .svelte-kit
          key: ${{ steps.deps-key.outputs.key }}

  # ─── Lint: prettier + eslint + stylelint + dep-cruiser + arch ──
  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore node_modules + .svelte-kit
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .svelte-kit
          key: ${{ needs.setup.outputs.deps-cache-key }}
          fail-on-cache-miss: true

      - name: Restore ESLint + Stylelint cache
        uses: actions/cache@v5
        with:
          path: |
            .eslintcache
            .stylelintcache
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', '.stylelintrc.cjs') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', '.stylelintrc.cjs') }}-
            lint-${{ runner.os }}-

      - name: Lint — prettier + eslint
        # NODE_OPTIONS heap bump prevents GC thrash on the 7GB runner
        # during typescript-eslint's TS-program load.
        # --concurrency=auto (set in package.json) splits across cores.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run lint

      - name: Lint — stylelint (design-token discipline)
        run: npm run lint:css

      - name: Lint — dependency-cruiser (layering boundaries)
        run: npm run lint:deps

      - name: Architecture gate — 13 custom static checks
        # Component inventory, token completeness, WCAG contrast, locale
        # parity, RTL safety, i18n coverage, route +error.svelte pages,
        # feature structure, fetch placement, Svelte-5 purity, LOC budgets,
        # /v1/platform path scope, mutate-then-refetch ban.
        run: npm run arch:check

      - name: Lint — knip (dead code + unused exports) — ADVISORY
        # Knip surfaces unused exports + files. Currently advisory because
        # the feature barrels expose types that aren't consumed yet by
        # route code. Promote to a hard gate once the consumer surface
        # stabilises (tracked: Phase F).
        run: npm run lint:dead -- --no-exit-code || true

  # ─── Typecheck (svelte-check + tsc) ─────────────────────────────
  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Restore node_modules + .svelte-kit
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .svelte-kit
          key: ${{ needs.setup.outputs.deps-cache-key }}
          fail-on-cache-miss: true
      - name: svelte-check + tsc
        run: npm run check

  # ─── Unit tests + coverage ──────────────────────────────────────
  test:
    name: Unit tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Restore node_modules + .svelte-kit
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .svelte-kit
          key: ${{ needs.setup.outputs.deps-cache-key }}
          fail-on-cache-miss: true
      - name: Vitest with coverage
        run: npm run test:coverage
      - name: Upload coverage (push-to-main only)
        # Coverage on PR is rarely actioned; the merged-into-main report
        # is the one teams reference for trend lines. Skipping PR uploads
        # saves ~20s per PR + storage.
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ─── Build + bundle-size budget ─────────────────────────────────
  # Build output uploaded as artifact; e2e shards below download it
  # rather than rebuilding from source (saves ~10s × 2 shards).
  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Restore node_modules + .svelte-kit
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .svelte-kit
          key: ${{ needs.setup.outputs.deps-cache-key }}
          fail-on-cache-miss: true
      - name: Vite build
        run: npm run build
      - name: Bundle-size check
        run: npx size-limit
      - name: Upload build artifact for e2e shards
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: build/
          retention-days: 1
          if-no-files-found: error

  # ─── E2E sharded across 2 parallel runners ──────────────────────
  # Playwright's --shard=N/M splits spec files across M shards. Our
  # 18 spec files split 9/9; each shard runs ~2-3 min on a single
  # worker. Parallel = ~3 min wall-clock vs 5 min serial.
  #
  # Each shard:
  #   - restores node_modules
  #   - downloads the build artifact from the build job
  #   - installs Playwright chromium (cached by version)
  #   - runs `playwright test --shard=N/2`
  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Restore node_modules + .svelte-kit
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .svelte-kit
          key: ${{ needs.setup.outputs.deps-cache-key }}
          fail-on-cache-miss: true
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: build/
      - name: Get Playwright version
        id: pw-version
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright chromium
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium
      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: E2E tests — shard ${{ matrix.shard }}/2
        # Chromium-only matrix per chore/ci-cost-reduction (Firefox +
        # WebKit re-add when a browser-specific bug surfaces). ~70% of
        # browser usage is Chromium-based.
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/2 --reporter=html
        env:
          CI: 'true'
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # ─── Sentinel: aggregates pass/fail of every required job ──────
  # GitHub branch-protection points at this single job rather than
  # the matrix (which would otherwise require each shard to be listed
  # individually). When this passes, the PR is mergeable.
  #
  # `if: always()` so the sentinel still evaluates even when an
  # upstream job fails — and explicitly fails itself in that case.
  ci-pass:
    name: CI pass
    if: always()
    needs:
      - setup
      - lint
      - typecheck
      - test
      - build
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify all required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed."
