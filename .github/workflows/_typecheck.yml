name: _typecheck
# Reusable workflow — svelte-check + tsc. Called by ci.yml.
#
# svelte-check runs against .svelte-kit/tsconfig.json (generated by the
# composite setup action's svelte-kit sync step). Typically ~30s on
# warm node_modules cache.

on:
  workflow_call:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: svelte-check + tsc
        run: npm run check
